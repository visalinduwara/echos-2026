<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 800 800"
     width="800"
     height="800">

  <defs>

    <!-- Gold Gradient -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff3a0"/>
      <stop offset="35%" stop-color="#ffd34d"/>
      <stop offset="70%" stop-color="#e7a900"/>
      <stop offset="100%" stop-color="#fff0a0"/>
    </linearGradient>

    <!-- Red Gradient -->
    <linearGradient id="red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff3b30"/>
      <stop offset="45%" stop-color="#b40000"/>
      <stop offset="100%" stop-color="#5d0000"/>
    </linearGradient>

    <!-- Glow -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text Glow -->
    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Outer Gold Ring -->
  <circle
    cx="400"
    cy="400"
    r="350"
    fill="none"
    stroke="url(#gold)"
    stroke-width="12"
    filter="url(#glow)"
  />

  <!-- Inner Red Ring -->
  <circle
    cx="400"
    cy="400"
    r="320"
    fill="none"
    stroke="url(#red)"
    stroke-width="8"
  />

  <!-- Decorative Diamonds -->
  <g fill="url(#gold)">

    <path d="M400 35 L414 60 L400 85 L386 60 Z"/>
    <path d="M400 715 L414 740 L400 765 L386 740 Z"/>
    <path d="M35 400 L60 386 L85 400 L60 414 Z"/>
    <path d="M715 400 L740 386 L765 400 L740 414 Z"/>

  </g>


  <!-- Top Decorative Lines -->
  <g
    stroke="url(#gold)"
    stroke-width="5"
    stroke-linecap="round">

    <line x1="190" y1="185" x2="300" y2="145"/>
    <line x1="610" y1="185" x2="500" y2="145"/>

  </g>


  <!-- Central Badge -->
  <circle
    cx="400"
    cy="400"
    r="225"
    fill="#100303"
    stroke="url(#gold)"
    stroke-width="7"
  />


  <!-- ECHO Symbol -->
  <g
    fill="none"
    stroke="url(#gold)"
    stroke-width="9"
    stroke-linecap="round"
    opacity=".9">

    <path d="M325 270 C285 300 285 500 325 530"/>
    <path d="M355 295 C325 325 325 475 355 505"/>

    <path d="M475 270 C515 300 515 500 475 530"/>
    <path d="M445 295 C475 325 475 475 445 505"/>

  </g>


  <!-- ECHOS -->
  <text
    x="400"
    y="405"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="112"
    font-weight="900"
    letter-spacing="8"
    fill="url(#gold)"
    filter="url(#textGlow)">
    ECHOS
  </text>


  <!-- 2026 -->
  <text
    x="400"
    y="475"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="55"
    font-weight="800"
    letter-spacing="12"
    fill="#ffffff">
    2026
  </text>


  <!-- Small divider -->
  <line
    x1="300"
    y1="505"
    x2="500"
    y2="505"
    stroke="url(#gold)"
    stroke-width="3"
  />


  <!-- SCHOOL -->
  <text
    x="400"
    y="560"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="18"
    font-weight="700"
    letter-spacing="3"
    fill="#ffffff
